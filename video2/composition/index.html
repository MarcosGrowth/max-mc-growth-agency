      #tap { position: absolute; left: 0; width: 1080px; top: 975px; text-align: center; font-size: 54px; font-weight: 800; }
      #arrow { position: absolute; left: 480px; top: 1070px; width: 120px; height: 150px; }

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="38">

        <div id="g-h2" class="full" data-layout-allow-overlap>
          <div id="h2chat">
            <div class="who"><div class="av"></div><div><div style="font-size:34px; font-weight:700">Cliente potencial</div><div class="mono" id="h2st" style="font-size:22px; color:#8a90a0; letter-spacing:2px; margin-top:6px">EN LÍNEA</div></div></div>
            <div class="msg" id="h2m1" style="left:34px; top:150px; background:#24262e">Hola, ¿precio?</div>

      <!-- CAPÍTULOS (piezas de Remotion) -->
      <video id="v1" class="vid" src="assets/clips/R2-Objetivo.webm" muted playsinline data-start="7.25" data-duration="7.35" data-track-index="3"></video>

    <script>
      const D = window.R2, TL = D.tl, W = D.w;
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const HOOK = ["h1", "h2", "h3"].includes(vars.gancho) ? vars.gancho : "h1";
      const E = TL.escenas;
      ["h1", "h2", "h3"].forEach((h) => { if (h !== HOOK) document.getElementById("g-" + h).remove(); });

      // generador determinista
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(517), R = (a, b) => a + (b - a) * rnd();

      // ── subtítulos ──
      const capsEl = document.getElementById("caps");
      const chunks = D.caps[HOOK].concat(D.caps.body);
      chunks.forEach((c, i) => {
        const el = document.createElement("div");
        el.className = "cap"; el.id = "cap" + i;
        el.setAttribute("data-layout-allow-overlap", "");
        el.style.fontSize = c.fs + "px";
        el.innerHTML = c.words.map((w) => `<span class="${w.c ? "c-" + w.c : ""}">${w.w}</span>`).join("");
        capsEl.appendChild(el);
      });

      // ── gancho H1: lluvia de consultas ──
      if (HOOK === "h1") {
        const g = document.getElementById("g-h1");
        const msgs = ["¿Precio?", "Info", "Hola", "¿Cuánto sale?", "?", "¿Hacen envíos?", "Info por favor", "¿Precio?"];
        const pos = [[110, 430], [600, 470], [330, 580], [80, 700], [720, 650], [420, 780], [140, 900], [610, 880]];
        msgs.forEach((m, i) => {
          const b = document.createElement("div");
          b.className = "bub"; b.id = "hb" + i; b.textContent = m;
          b.style.left = pos[i][0] + "px"; b.style.top = pos[i][1] + "px";
          b.setAttribute("data-layout-allow-overlap", "");
          g.appendChild(b);
        });
        const s = document.createElement("div");
        s.className = "stamp"; s.id = "h1stamp"; s.textContent = "NO COMPRAN";
        s.style.left = "150px"; s.style.top = "640px"; s.style.fontSize = "92px";
        g.appendChild(s);
      }
      // ── gancho H3: punteros "curiosos" ──
      if (HOOK === "h3") {
        const g = document.getElementById("h3curs");
        for (let i = 0; i < 14; i++) {
          const ns = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("viewBox", "0 0 27 32"); svg.setAttribute("width", "64"); svg.setAttribute("height", "76");
          svg.id = "cur" + i; svg.style.position = "absolute";
          const ang = (i / 14) * Math.PI * 2, rr = R(300, 420);
          svg.style.left = Math.round(508 + Math.cos(ang) * rr) + "px"; svg.style.top = Math.round(700 + Math.sin(ang) * rr * 0.62) + "px";
          svg.innerHTML = '<path d="M2 2 L2 26 L8.5 20 L13 30 L17.5 28 L13 18.5 L22 18.5 Z" fill="#fff" stroke="#09090B" stroke-width="2" stroke-linejoin="round"/>';
          g.appendChild(svg);
        }
      }

      // ── línea de tiempo ──
      const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
      tl.fromTo("#grid", { x: 0, y: 0 }, { x: -90, y: -270, duration: TL.duracion, ease: "none" }, 0);
      tl.fromTo("#glow", { opacity: 0.4, scale: 0.9 }, { opacity: 0.8, scale: 1.05, duration: 3, ease: "sine.inOut" }, 0);

      // subtítulos: entra cada bloque con golpe; sale seco cuando llega el siguiente
      chunks.forEach((c, i) => {
        const sel = "#cap" + i;
        tl.fromTo(sel, { opacity: 0, scale: 1.18, y: 18, filter: "blur(8px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, c.t);
        tl.to(sel, { opacity: 0, duration: 0.04, ease: "none" }, Math.max(c.t + 0.26, c.end - 0.03));
      });

      // logo en el gancho (marca en los primeros segundos)
      tl.fromTo("#hlogo", { opacity: 0, y: -20, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5 }, 0.2);
      tl.to("#hlogo", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 3.15);

      if (HOOK === "h1") {
        for (let i = 0; i < 8; i++) {
          tl.fromTo("#hb" + i, { opacity: 0, y: -260, scale: 0.6, rotation: R(-20, 20) }, { opacity: 1, y: 0, scale: 1, rotation: R(-6, 6), duration: 0.5, ease: "back.out(1.6)" }, 0.12 + i * 0.16);
        }
        const hit = W.h1.compran;
        tl.to(Array.from({ length: 8 }, (_, i) => "#hb" + i), { opacity: 0.25, filter: "grayscale(1) blur(2px)", duration: 0.2, ease: "none" }, hit);
        tl.fromTo("#h1stamp", { opacity: 0, scale: 2.4, rotation: -14 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.25, ease: "power4.out" }, hit); // beat-locked
        tl.fromTo("#g-h1", { x: 0 }, { x: 14, duration: 0.05, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, hit + 0.02);
      }
      if (HOOK === "h2") {
        tl.fromTo("#h2chat", { opacity: 0, y: 60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45 }, 0.1);
        tl.fromTo("#h2m1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, W.h2.pregunten - 0.1);
        tl.fromTo("#h2m2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, W.h2.precio + 0.15);
        tl.fromTo("#h2visto", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, W.h2.precio + 0.4);
        tl.to("#h2st", { opacity: 0.3, duration: 0.1, ease: "none" }, W.h2.desaparezcan);
        tl.to("#h2chat", { opacity: 0.12, filter: "blur(10px) grayscale(1)", scale: 0.92, duration: 0.6, ease: "power2.in" }, W.h2.desaparezcan);
        tl.fromTo("#h2stamp", { opacity: 0, scale: 2.4, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.25, ease: "power4.out" }, W.h2.desaparezcan + 0.1);
      }
      if (HOOK === "h3") {
        tl.fromTo("#big3", { opacity: 0, scale: 2.2, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, W.h3.tres);
        tl.fromTo("#big3", { scale: 1 }, { scale: 1.06, duration: 2.6, ease: "none", immediateRender: false }, W.h3.tres + 0.35);
        for (let i = 0; i < 14; i++) {
          tl.fromTo("#cur" + i, { opacity: 0, x: R(-200, 200), y: R(-200, 200), rotation: R(-40, 40) }, { opacity: 1, x: 0, y: 0, rotation: R(-15, 15), duration: 0.45, ease: "power3.out" }, W.h3.curiosos - 0.2 + i * 0.03);
        }
      }

      // GIRO — glitch "ERROR" (beat-locked: 3.40s)
      const g0 = E.giro;
      tl.set(["#errC", "#errR", "#errW"], { opacity: 0 }, 0);
      [[0, -14, 10, "inset(0% 0% 55% 0%)"], [0.06, 18, -8, "inset(40% 0% 20% 0%)"], [0.12, -8, 6, "inset(10% 0% 60% 0%)"], [0.18, 10, -12, "inset(60% 0% 0% 0%)"], [0.24, 0, 0, "inset(0% 0% 0% 0%)"]].forEach(([dt, dx, dy, clip]) => {
        tl.set("#errC", { opacity: 0.85, x: dx, y: dy, clipPath: clip }, g0 + dt);
        tl.set("#errR", { opacity: 0.85, x: -dx, y: -dy, clipPath: clip }, g0 + dt);
        tl.set("#errW", { opacity: 1, x: dx * 0.3, clipPath: clip }, g0 + dt);
      });
      tl.set(["#errC", "#errR"], { opacity: 0 }, g0 + 0.3);
      tl.to("#errW", { opacity: 0, scale: 0.9, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, g0 + 0.55);
      tl.fromTo("#pill", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4 }, g0 + 0.75);
      tl.fromTo("#pillok", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, W.b1.meta);
      tl.to("#pill", { y: -120, opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, W.b1.tres - 0.25);
      ["#chip1", "#chip2", "#chip3"].forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, x: 140, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4 }, W.b1.tres + i * 0.12);
      });
      // los capítulos 02 y 03 se van; el 01 sube y se convierte en el encabezado
      tl.to(["#chip2", "#chip3"], { opacity: 0, y: 60, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, E.cap1 - 0.3);
      tl.to("#chip1", { x: -80, y: -185, scale: 0.9, opacity: 0, duration: 0.32, ease: "power3.in" }, E.cap1 - 0.3);

      // CAPÍTULOS: encabezado + piezas de Remotion
      const headIn = (sel, t) => tl.fromTo(sel, { opacity: 0, x: -40, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45 }, t);
      headIn("#head1", E.cap1);
      headIn("#head2", E.cap2);
      headIn("#head3", E.cap3);
      tl.to("#head1", { opacity: 0, duration: 0.2, ease: "none" }, E.cap2 - 0.25);
      // capítulo 2 en claro: el fondo claro barre desde arriba y se va al final
